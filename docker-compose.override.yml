# Custom OpenClaw overrides (PII proxy, GROQ, custom skills)
# This file is auto-merged by Docker Compose with docker-compose.yml.
# Keep upstream-specific config in docker-compose.yml untouched.

services:
  pii-proxy:
    build: ./pii-proxy
    restart: unless-stopped
    environment:
      PII_EMAIL_WHITELIST: "tomis.martin@gmail.com,claudie.tomis@gmail.com"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  openclaw-gateway:
    build:
      context: .
      args:
        OPENCLAW_INSTALL_BROWSER: "1"
    ports:
      - "127.0.0.1:3800-3810:3800-3810"
      - "10.10.0.1:3800-3810:3800-3810"
    depends_on:
      pii-proxy:
        condition: service_healthy
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - /home/deploy/.local/bin/gog:/usr/local/bin/gog:ro
      - /home/deploy/.config/gogcli:/home/node/.config/gogcli
      - /home/deploy/.node-llama-cpp-models:/home/node/.node-llama-cpp/models
      - /home/deploy/openclaw/skills/gog/SKILL.md:/app/skills/gog/SKILL.md:ro
      - /home/deploy/openclaw/skills/upgrade/SKILL.md:/app/skills/upgrade/SKILL.md:ro

  openclaw-cli:
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - /home/deploy/.local/bin/gog:/usr/local/bin/gog:ro
      - /home/deploy/.config/gogcli:/home/node/.config/gogcli
      - /home/deploy/.node-llama-cpp-models:/home/node/.node-llama-cpp/models
      - /home/deploy/openclaw/skills/gog/SKILL.md:/app/skills/gog/SKILL.md:ro
      - /home/deploy/openclaw/skills/upgrade/SKILL.md:/app/skills/upgrade/SKILL.md:ro

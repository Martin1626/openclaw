# Fork-only: builds the VPS gateway image off-box (the 4 GB VPS runs out of RAM/disk
# during tsdown). Mirrors the build section of docker-compose.override.yml.
# Deploy: download the artifact, then `gunzip -c openclaw-local.tar.gz | docker load` on the VPS.
name: Fork Gateway Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        default: main
        required: false
      repository:
        description: Source repository (openclaw/openclaw for upstream stepping-stone releases)
        default: Martin1626/openclaw
        required: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Martin1626/openclaw'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Build openclaw:local
        env:
          BUILDKIT_PROGRESS: plain
        run: |
          docker build \
            --build-arg OPENCLAW_INSTALL_BROWSER=1 \
            --build-arg OPENCLAW_EXTENSIONS=codex,whatsapp \
            --build-arg GIT_COMMIT="$(git rev-parse HEAD)" \
            -t openclaw:local .
          docker run --rm --entrypoint node openclaw:local -e "console.log(require('/app/package.json').version)"

      - name: Export image
        run: |
          docker save openclaw:local | gzip -1 > openclaw-local.tar.gz
          ls -lh openclaw-local.tar.gz
          sha256sum openclaw-local.tar.gz | tee openclaw-local.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: openclaw-local-image
          path: |
            openclaw-local.tar.gz
            openclaw-local.tar.gz.sha256
          compression-level: 0
          retention-days: 3
